[project]
name = "ola-ai-dataagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Soumya Ranjan Mohapatra", email = "132839290+SoumyaRM2004@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.20.0",
    "ipython>=9.16.1",
    "langchain>=1.3.16",
    "langchain-google-genai>=4.3.6",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "requests>=2.32.0",
]

[project.scripts]
ola-ai-dataagent = "ola_ai_dataagent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
